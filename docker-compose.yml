services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmats}
      POSTGRES_DB: ${POSTGRES_DB:-rmatsdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmats} -d ${POSTGRES_DB:-rmatsdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./rmats-viz/backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rmats}:${POSTGRES_PASSWORD:-rmats}@db:5432/${POSTGRES_DB:-rmatsdb}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      GRCH38_FASTA: /data/GRCh38.fa
      MANE_CACHE_DB: /data/mane_cache.db
      MANE_GFF3: /data/MANE.GRCh38.ensembl_genomic.gff.gz
    volumes:
      - ./rmats-viz/backend:/app
      - ./rmats-viz/data:/data
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - |
        if [ ! -f /data/MANE.GRCh38.ensembl_genomic.gff.gz ]; then
          echo '[startup] Downloading MANE GFF3 (~3 MB)...'
          curl -fSL --retry 3 \
            -o /data/MANE.GRCh38.ensembl_genomic.gff.gz \
            https://ftp.ncbi.nlm.nih.gov/refseq/MANE/MANE_human/current/MANE.GRCh38.v1.4.ensembl_genomic.gff.gz \
            || echo '[startup] MANE GFF3 download failed — will use Ensembl REST fallback'
        fi
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 600

  frontend:
    build: ./rmats-viz/frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8000
    volumes:
      - ./rmats-viz/frontend/src:/app/src
    ports:
      - "3000:3000"

volumes:
  postgres_data:
