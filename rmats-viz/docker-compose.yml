services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rmats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmats}
      POSTGRES_DB: ${POSTGRES_DB:-rmatsdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmats} -d ${POSTGRES_DB:-rmatsdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rmats}:${POSTGRES_PASSWORD:-rmats}@db:5432/${POSTGRES_DB:-rmatsdb}
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      GRCH38_FASTA: /data/GRCh38.fa
      MANE_CACHE_DB: /data/mane_cache.db
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 600 --log-level info"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/next.config.mjs:/app/next.config.mjs:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
